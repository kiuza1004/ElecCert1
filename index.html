  <!-- ============================================================
       CSS 섹션 (Tailwind 외 커스텀 스타일)
       ============================================================ -->
  <style>
    html, body { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Pretendard Variable', 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      min-height: 100vh;
    }
    .scroll-smooth-y { scroll-behavior: smooth; }
    .fade-in { animation: fadeIn .25s ease-out both; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* 라디오 카드 스타일 */
    .opt-label {
      transition: all .15s ease;
      border: 1.5px solid #e2e8f0;
    }
    .opt-label:hover { border-color: #38bdf8; background:#f0f9ff; }
    .opt-input:checked + .opt-label {
      border-color: #0284c7; background: #e0f2fe; box-shadow: 0 1px 0 #bae6fd inset;
    }
    .opt-input:checked + .opt-label .opt-num {
      background:#0284c7; color:#fff; border-color:#0284c7;
    }
    /* 정답/오답 상태 */
    .opt-correct   { border-color:#16a34a !important; background:#dcfce7 !important; }
    .opt-wrong     { border-color:#dc2626 !important; background:#fee2e2 !important; }
    .opt-correct .opt-num { background:#16a34a !important; color:#fff !important; border-color:#16a34a !important; }
    .opt-wrong   .opt-num { background:#dc2626 !important; color:#fff !important; border-color:#dc2626 !important; }

    /* 탭 카드 hover */
    .mode-card { transition: transform .15s ease, box-shadow .15s ease; }
    .mode-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -10px rgba(2,132,199,.35); }

    /* 진행률 바 */
    .progress-track { background:#e2e8f0; }
    .progress-bar { background: linear-gradient(90deg, #38bdf8, #0284c7); transition: width .4s ease; }

    /* 스크롤바 (PC) */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background:#94a3b8; }

    /* 시퀀스 회로 SVG 컨테이너 */
    .diagram-box { background:#0f172a; color:#e2e8f0; border-radius:14px; }

    /* 하단 고정 네비 */
    .sticky-nav {
      position: sticky; bottom: 0; left: 0; right: 0;
      backdrop-filter: blur(8px);
      background: rgba(255,255,255,.85);
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>

  /* ============================================================
   *  [2] 상태 관리 (State + LocalStorage)
   * ============================================================ */
  const STORAGE_KEY = 'voltpass_state_v1';
  const defaultState = {
    solvedIds: [],   // 한 번이라도 푼 문제 id 목록
    wrongIds: [],    // 오답 노트 id 목록
    last: null       // { mode, subject, index }
  };
  let state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return structuredClone(defaultState);
      const parsed = JSON.parse(raw);
      return { ...structuredClone(defaultState), ...parsed };
    } catch { return structuredClone(defaultState); }
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
  function markSolved(id) {
    if (!state.solvedIds.includes(id)) state.solvedIds.push(id);
    saveState();
  }
  function toggleWrong(id, force) {
    const i = state.wrongIds.indexOf(id);
    if (force === true && i < 0) state.wrongIds.push(id);
    else if (force === false && i >= 0) state.wrongIds.splice(i,1);
    else if (force === undefined) {
      if (i >= 0) state.wrongIds.splice(i,1);
      else state.wrongIds.push(id);
    }
    saveState();
  }

  /* ============================================================
   *  [3] 유틸 함수
   * ============================================================ */
  const $app = document.getElementById('app');
  const subjectName = { 1:'1과목 · 전기이론', 2:'2과목 · 전기기기', 3:'3과목 · 전기설비', 4:'4과목 · 실기(작업형)' };
  const subjectShort = { 1:'전기이론', 2:'전기기기', 3:'전기설비', 4:'실기 작업형' };

  function getBySubject(s){ return QUESTIONS.filter(q => q.subject === s); }
  function shuffle(arr){
    const a = arr.slice();
    for (let i=a.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function updateWrongBadge(){
    document.getElementById('wrong-count').textContent = state.wrongIds.length;
  }

  /* ============================================================
   *  [4] 라우팅 / 렌더 진입점
   *      view: 'home' | 'writtenSubjects' | 'writtenMode' | 'solve' | 'practical' | 'wrong'
   * ============================================================ */
  let currentView = { name: 'home' };

  function navigate(view){
    currentView = view;
    render();
  }
  function render(){
    updateWrongBadge();
    switch(currentView.name){
      case 'home':            return renderHome();
      case 'writtenSubjects': return renderWrittenSubjects();
      case 'writtenMode':     return renderWrittenMode(currentView.subject);
      case 'solve':           return renderSolve(currentView.session);
      case 'practical':       return renderPractical();
      case 'wrong':           return renderWrongNote();
      default:                return renderHome();
    }
  }

  /* ============================================================
   *  [8] 풀이 세션 (학습 / 모의고사 공용)
   * ============================================================ */
  function startSolveSession({ids, mode, subject, startIndex=0}){
    const session = {
      ids, mode, subject,
      index: Math.max(0, Math.min(startIndex, ids.length-1)),
      answers: new Array(ids.length).fill(null), // 사용자가 고른 보기번호(1~4)
      checked: new Array(ids.length).fill(false),
      finished: false
    };
    navigate({ name:'solve', session });
  }

  function renderSolve(s){
    if (s.finished) return renderResult(s);

    const qid = s.ids[s.index];
    const q = QUESTIONS.find(x=>x.id===qid);
    const userPick = s.answers[s.index];
    const isChecked = s.checked[s.index];
    const isWrong = state.wrongIds.includes(q.id);
    const modeLabel = s.mode === 'study' ? '학습 모드' : '모의고사';

    // 최근 학습 저장
    state.last = {
      kind: 'written',
      mode: s.mode,
      subject: s.subject,
      index: s.index,
      ids: s.ids,
      label: `${subjectName[s.subject]} · ${modeLabel} (${s.index+1}/${s.ids.length})`
    };
    saveState();

    $app.innerHTML = `
      <section class="fade-in">
        <div class="flex items-center justify-between mb-3">
          <button id="back-mode" class="text-sm text-brand-600">← 종료</button>
          <div class="text-xs text-slate-500">
            <span class="font-semibold text-slate-700">${modeLabel}</span> · ${subjectShort[s.subject]}
          </div>
        </div>

        <div class="flex items-center justify-between mb-2 text-xs text-slate-500">
          <span>문제 ${s.index+1} / ${s.ids.length}</span>
          <span>ID #${q.id}</span>
        </div>
        <div class="w-full h-1.5 rounded-full progress-track overflow-hidden mb-4">
          <div class="h-full progress-bar" style="width:${((s.index+1)/s.ids.length)*100}%"></div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
          ${q.category ? `<div class="inline-block text-[10px] font-bold tracking-wider bg-amber-100 text-amber-700 px-2 py-0.5 rounded mb-2">${escapeHtml(q.category)}</div>` : ''}
          <h3 class="text-base sm:text-lg font-semibold text-slate-900 leading-relaxed mb-4">
            Q. ${escapeHtml(q.question)}
          </h3>

          <div class="space-y-2.5" id="opts">
            ${q.options.map((opt, i)=>{
              const num = i+1;
              const id = `opt-${q.id}-${num}`;
              let extra = '';
              if (isChecked){
                if (num === q.answer) extra = 'opt-correct';
                else if (num === userPick) extra = 'opt-wrong';
              }
              const checked = userPick === num ? 'checked' : '';
              return `
                <input class="opt-input hidden" type="radio" name="opt-${q.id}" id="${id}" value="${num}" ${checked} ${isChecked?'disabled':''}>
                <label for="${id}" class="opt-label ${extra} flex items-start gap-3 rounded-xl p-3 cursor-pointer bg-white">
                  <span class="opt-num flex-shrink-0 w-7 h-7 rounded-full border border-slate-300 text-slate-600 grid place-items-center text-sm font-bold">${num}</span>
                  <span class="text-sm sm:text-base text-slate-800 leading-relaxed pt-0.5">${escapeHtml(opt)}</span>
                </label>`;
            }).join('')}
          </div>

          ${ isChecked ? `
            <div class="mt-4 p-4 rounded-xl ${userPick===q.answer?'bg-emerald-50 border border-emerald-200':'bg-rose-50 border border-rose-200'}">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-sm font-bold ${userPick===q.answer?'text-emerald-700':'text-rose-700'}">
                  ${userPick===q.answer?'✅ 정답입니다':'❌ 오답입니다'}
                </span>
                <span class="text-xs text-slate-500">정답: ${q.answer}번</span>
              </div>
              <p class="text-sm text-slate-700 leading-relaxed">
                <span class="font-semibold">해설.</span> ${escapeHtml(q.explanation)}
              </p>
            </div>` : `` }
        </div>

        <!-- 액션 영역 -->
        <div class="mt-4 grid grid-cols-3 gap-2">
          <button id="btn-prev"
            class="col-span-1 py-3 rounded-xl bg-slate-100 text-slate-700 font-semibold disabled:opacity-40"
            ${s.index===0?'disabled':''}>← 이전</button>

          ${ !isChecked ? `
            <button id="btn-check"
              class="col-span-2 py-3 rounded-xl bg-brand-600 text-white font-bold shadow disabled:opacity-40"
              ${userPick==null?'disabled':''}>정답 확인</button>` : `
            <button id="btn-next"
              class="col-span-2 py-3 rounded-xl bg-brand-600 text-white font-bold shadow">
              ${s.index === s.ids.length-1 ? (s.mode==='exam' ? '결과 보기' : '학습 완료') : '다음 문제 →'}
            </button>` }
        </div>

        <div class="mt-3 flex items-center justify-center gap-2">
          <button id="btn-wrong-toggle"
            class="text-xs px-3 py-1.5 rounded-lg border ${isWrong?'bg-amber-500 text-white border-amber-500':'bg-white text-amber-700 border-amber-300'} font-semibold">
            ${isWrong ? '★ 오답노트에서 제거' : '☆ 오답노트에 추가'}
          </button>
        </div>
      </section>
    `;

    // 이벤트
    document.getElementById('back-mode').onclick = ()=>{
      if (s.subject === 4) navigate({name:'practical'});
      else navigate({name:'writtenMode', subject: s.subject});
    };

    $app.querySelectorAll('input[name="opt-'+q.id+'"]').forEach(inp=>{
      inp.addEventListener('change', e=>{
        s.answers[s.index] = Number(e.target.value);
        renderSolve(s); // 버튼 활성화 갱신
      });
    });

    const btnPrev = document.getElementById('btn-prev');
    if (btnPrev) btnPrev.onclick = ()=>{ s.index = Math.max(0, s.index-1); renderSolve(s); };

    const btnCheck = document.getElementById('btn-check');
    if (btnCheck) btnCheck.onclick = ()=>{
      if (s.answers[s.index] == null) return;
      s.checked[s.index] = true;
      markSolved(q.id);
      // 학습모드: 즉시 오답이면 자동 오답노트 등록 안 함 (수동), 시험모드도 동일
      renderSolve(s);
    };

    const btnNext = document.getElementById('btn-next');
    if (btnNext) btnNext.onclick = ()=>{
      if (s.index === s.ids.length-1){
        s.finished = true;
        renderResult(s);
      } else {
        s.index++;
        renderSolve(s);
      }
    };

    document.getElementById('btn-wrong-toggle').onclick = ()=>{
      toggleWrong(q.id);
      renderSolve(s);
    };
  }

  /* ============================================================
   *  [9] 모의고사 결과
   * ============================================================ */
  function renderResult(s){
    let correct = 0;
    s.ids.forEach((id, i)=>{
      const q = QUESTIONS.find(x=>x.id===id);
      if (s.answers[i] === q.answer) correct++;
      else if (s.answers[i] != null) toggleWrong(id, true);
    });
    const total = s.ids.length;
    const score = Math.round(correct/total*100);
    const pass = score >= 60;

    $app.innerHTML = `
      <section class="fade-in">
        <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm text-center">
          <div class="text-sm text-slate-500">${s.mode==='exam'?'모의고사 결과':'학습 결과'}</div>
          <div class="text-5xl font-extrabold mt-2 ${pass?'text-emerald-600':'text-rose-600'}">${score}점</div>
          <div class="text-sm mt-1 ${pass?'text-emerald-700':'text-rose-700'} font-semibold">
            ${pass?'🎉 합격선 통과 (60점 이상)':'아쉽습니다. 60점 미만'}
          </div>
          <div class="mt-3 text-slate-600 text-sm">
            정답 <b class="text-slate-900">${correct}</b> / 오답 <b class="text-slate-900">${total-correct}</b> / 총 ${total}문항
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mt-4">
          <button id="btn-review" class="py-3 rounded-xl bg-slate-800 text-white font-bold">오답 다시보기</button>
          <button id="btn-home2" class="py-3 rounded-xl bg-brand-600 text-white font-bold">대시보드</button>
        </div>
      </section>
    `;
    document.getElementById('btn-review').onclick = ()=>navigate({name:'wrong'});
    document.getElementById('btn-home2').onclick  = ()=>navigate({name:'home'});
  }

            <line x1="135" y1="90" x2="170" y2="90" stroke="#e2e8f0" stroke-width="2"/>
            <text x="115" y="76" fill="#fde68a" font-size="11">PB2(a)</text>

            <!-- MC-a 자기유지 접점 (병렬) -->
            <line x1="80" y1="115" x2="120" y2="115" stroke="#34d399" stroke-width="2"/>
            <line x1="120" y1="105" x2="135" y2="125" stroke="#34d399" stroke-width="2"/>
            <line x1="135" y1="115" x2="170" y2="115" stroke="#34d399" stroke-width="2"/>
            <line x1="80" y1="90" x2="80" y2="115" stroke="#34d399" stroke-width="2"/>
            <line x1="170" y1="90" x2="170" y2="115" stroke="#34d399" stroke-width="2"/>
            <text x="115" y="135" fill="#86efac" font-size="11">MC-a (자기유지)</text>

            <!-- MC 코일 -->
            <line x1="170" y1="90" x2="250" y2="90" stroke="#e2e8f0" stroke-width="2"/>
            <circle cx="265" cy="90" r="14" stroke="#f472b6" stroke-width="2" fill="none"/>
            <text x="259" y="94" fill="#f9a8d4" font-size="12" font-weight="bold">MC</text>
            <line x1="279" y1="90" x2="340" y2="90" stroke="#e2e8f0" stroke-width="2"/>
            <line x1="340" y1="20" x2="340" y2="140" stroke="#38bdf8" stroke-width="2"/>
          </svg>
          <div class="text-[11px] text-slate-300 mt-1">
            PB2(기동)를 누르면 MC가 여자되고, MC-a 접점이 닫혀 PB2를 떼도 자기유지됨. PB1(정지)로 회로 차단.
          </div>
        </div>

        <!-- 카테고리 칩 -->
        <div class="flex flex-wrap gap-2 mb-4" id="chips">
          <button data-cat="all" class="cat-chip px-3 py-1.5 rounded-full text-xs font-semibold bg-brand-600 text-white">전체</button>
          ${categories.map(c=>`
            <button data-cat="${c}" class="cat-chip px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-700">${c}</button>
          `).join('')}
        </div>

        <!-- 시작 버튼 + 체크리스트 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5">
          <button id="btn-quiz-start" class="py-4 rounded-xl bg-amber-500 text-white font-bold shadow hover:bg-amber-600">
            🎯 실기 퀴즈 시작 (${list.length}문항)
          </button>
          <button id="btn-checklist" class="py-4 rounded-xl bg-white border border-amber-300 text-amber-700 font-bold hover:bg-amber-50">
            ✅ 실격 사유 체크리스트
          </button>
        </div>

        <!-- 핀번호 표 -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4">
          <div class="text-sm font-bold text-slate-800 mb-2">📌 핀 번호 부여 (8핀 릴레이 MY2N)</div>
          <div class="grid grid-cols-4 gap-2 text-xs text-center">
            ${[
              ['1','COM1'],['3','a1'],['5','b1'],['7','코일+'],
              ['4','COM2'],['2','a2'],['6','b2'],['8','코일-']
            ].map(([p,n])=>`
              <div class="bg-slate-50 rounded-lg p-2">
                <div class="font-bold text-brand-700">${p}번</div>
                <div class="text-slate-600">${n}</div>
              </div>`).join('')}
          </div>
          <div class="text-[11px] text-slate-500 mt-2">※ 코일 단자는 <b>7-8</b>번. 자기유지 회로에서 a접점(3-1, 6-4)을 활용한다.</div>
        </div>
      </section>
    `;

    // 카테고리 필터
    let cat = 'all';
    const startQuiz = ()=>{
      const filtered = cat==='all' ? list : list.filter(q=>q.category===cat);
      if (filtered.length===0){ alert('해당 카테고리에 문제가 없습니다.'); return; }
      const ids = shuffle(filtered).map(q=>q.id);
      startSolveSession({ ids, mode:'study', subject:4 });
    };

    document.getElementById('back-home2').onclick = ()=>navigate({name:'home'});
    document.getElementById('btn-quiz-start').onclick = startQuiz;
    document.getElementById('btn-checklist').onclick = ()=>{
      const disq = list.filter(q=>q.category==='실격 사유' || q.category==='결선 주의사항');
      if (disq.length===0){ alert('등록된 체크리스트 문항이 없습니다.'); return; }
      startSolveSession({ ids: disq.map(q=>q.id), mode:'study', subject:4 });
    };
    $app.querySelectorAll('.cat-chip').forEach(b=>{
      b.onclick = ()=>{
        cat = b.dataset.cat;
        $app.querySelectorAll('.cat-chip').forEach(x=>{
          x.classList.remove('bg-brand-600','text-white');
          x.classList.add('bg-slate-100','text-slate-700');
        });
        b.classList.remove('bg-slate-100','text-slate-700');
        b.classList.add('bg-brand-600','text-white');
      };
    });
  }

  /* ============================================================
   *  [11] 오답 노트
   * ============================================================ */
  function renderWrongNote(){
    const items = state.wrongIds
      .map(id => QUESTIONS.find(q=>q.id===id))
      .filter(Boolean);

    $app.innerHTML = `
      <section class="fade-in">
        <button class="text-sm text-brand-600 mb-3" id="back-home3">← 대시보드</button>
        <h2 class="text-xl font-bold mb-1">오답 노트</h2>
        <p class="text-sm text-slate-500 mb-4">등록된 ${items.length}개의 문제를 복습하세요.</p>

        ${ items.length===0 ? `
          <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-500">
            아직 등록된 오답이 없습니다.
          </div>` : `
          <button id="btn-review-all"
            class="w-full mb-4 py-3 rounded-xl bg-amber-500 text-white font-bold shadow">
            ▶ 오답 ${items.length}개 다시 풀기
          </button>
          <div class="space-y-3">
            ${items.map(q=>`
              <div class="bg-white rounded-xl border border-slate-200 p-4">
                <div class="flex items-start justify-between gap-2">
                  <div class="text-[11px] font-bold text-brand-700">${subjectShort[q.subject]} · #${q.id}</div>
                  <button data-rm="${q.id}" class="text-xs text-rose-600 hover:underline">제거</button>
                </div>
                <div class="text-sm font-semibold mt-1 text-slate-900">${escapeHtml(q.question)}</div>
                <div class="text-xs text-slate-500 mt-1">정답: ${q.answer}번 · ${escapeHtml(q.options[q.answer-1])}</div>
              </div>`).join('')}
          </div>`
        }
      </section>
    `;

    document.getElementById('back-home3').onclick = ()=>navigate({name:'home'});
    const ra = document.getElementById('btn-review-all');
    if (ra) ra.onclick = ()=> startSolveSession({
      ids: items.map(q=>q.id), mode:'study', subject: items[0].subject
    });
    $app.querySelectorAll('[data-rm]').forEach(b=>{
      b.onclick = ()=>{
        toggleWrong(Number(b.dataset.rm), false);
        renderWrongNote();
        updateWrongBadge();
      };
    });
  }

  /* ============================================================
   *  [12] 전역 이벤트
   * ============================================================ */
  document.getElementById('btn-home').addEventListener('click', ()=>navigate({name:'home'}));
  document.getElementById('btn-wrong-note').addEventListener('click', ()=>navigate({name:'wrong'}));
  document.getElementById('btn-reset').addEventListener('click', ()=>{
    if (!confirm('학습 기록과 오답 노트를 모두 초기화할까요?')) return;
    localStorage.removeItem(STORAGE_KEY);
    state = loadState();
    navigate({name:'home'});
  });

  /* ============================================================
   *  [13] 초기 렌더
   * ============================================================ */
  navigate({name:'home'});
  </script>
</body>
</html>
