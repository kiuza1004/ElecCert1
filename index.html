<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#0ea5e9" />
  <meta name="description" content="VoltPass - 전기기능사 CBT 필기시험 모의고사 10회분 + 과목별 핵심 정리" />
  <title>VoltPass · 전기기능사 CBT 필기</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',
              400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',
              800:'#075985',900:'#0c4a6e',
            }

  <!-- Pretendard -->
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

  <!-- =================== CSS =================== -->
  <style>
    html, body { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Pretendard Variable','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;
      background: linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%);
      min-height: 100vh;
    }
    .fade-in { animation: fadeIn .25s ease-out both; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    /* 보기 라디오 카드 */
    .opt-label { transition:all .15s ease; border:1.5px solid #e2e8f0; }
    .opt-label:hover { border-color:#38bdf8; background:#f0f9ff; }
    .opt-input:checked + .opt-label { border-color:#0284c7; background:#e0f2fe; }
    .opt-input:checked + .opt-label .opt-num { background:#0284c7; color:#fff; border-color:#0284c7; }
    .opt-correct { border-color:#16a34a !important; background:#dcfce7 !important; }
    .opt-wrong   { border-color:#dc2626 !important; background:#fee2e2 !important; }
    .opt-correct .opt-num { background:#16a34a !important; color:#fff !important; border-color:#16a34a !important; }
    .opt-wrong .opt-num   { background:#dc2626 !important; color:#fff !important; border-color:#dc2626 !important; }

    /* 카드 hover */
    .hover-card { transition: transform .15s ease, box-shadow .15s ease; }
    .hover-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -10px rgba(2,132,199,.35); }

    /* 진행률 바 */
    .progress-track { background:#e2e8f0; }
    .progress-bar   { background: linear-gradient(90deg,#38bdf8,#0284c7); transition: width .4s ease; }

    /* 문항 네비게이션 셀 */
    .nav-cell {
      aspect-ratio: 1/1; border-radius:8px; font-weight:700; font-size:.78rem;
      display:flex; align-items:center; justify-content:center; border:1.5px solid transparent;
      transition: all .12s ease; user-select:none;
    }
    .nav-blank    { background:#f1f5f9; color:#64748b; }
    .nav-answered { background:#dbeafe; color:#1e40af; }
    .nav-flagged  { background:#fef3c7; color:#92400e; box-shadow: inset 0 0 0 1.5px #f59e0b; }
    .nav-current  { outline: 2.5px solid #0284c7; outline-offset: 2px; }

    /* 타이머 */
    .timer-pill {
      font-variant-numeric: tabular-nums;
      background:#0f172a; color:#f1f5f9;
    }
    .timer-warn { background:#dc2626 !important; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

    /* 아코디언 */
    details > summary { list-style:none; cursor:pointer; }
    details > summary::-webkit-details-marker { display:none; }
    details[open] .acc-arrow { transform: rotate(180deg); }
    .acc-arrow { transition: transform .2s ease; }

    /* 스크롤바 */
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:8px; }
    ::-webkit-scrollbar-thumb:hover { background:#94a3b8; }

    /* KaTeX 비슷한 인라인 공식 */
    .formula {
      font-family: 'Cambria Math','Times New Roman',serif;
      font-style: italic; background:#f8fafc;
      padding: 2px 8px; border-radius: 6px; border:1px solid #e2e8f0;
      display:inline-block; margin: 2px 0;
    }

    /* ===== 문항 타이머 ===== */
    .q-timer {
      font-variant-numeric: tabular-nums;
      background:#1e293b; color:#f1f5f9;
    }
    .q-timer.qt-warn { background:#dc2626; }

    /* ===== 초읽기 오버레이 ===== */
    #countdown-overlay {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 60;
      display: none;
      align-items: center; justify-content: center;
    }
    #countdown-overlay.active { display: flex; }
    #countdown-overlay .num {
      font-size: clamp(140px, 32vw, 320px);
      font-weight: 900;
      color: rgba(220, 38, 38, .85);
      text-shadow: 0 8px 30px rgba(220,38,38,.5), 0 0 0 4px rgba(255,255,255,.15);
      font-variant-numeric: tabular-nums;
      animation: cd-pop .9s ease-out;
      line-height: 1;
    }
    @keyframes cd-pop {
      0%   { transform: scale(.4); opacity: 0; }
      40%  { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: .95; }
    }

    /* ===== 화면 가장자리 빨간 펄스 ===== */
    body.countdown-active::before {
      content:''; position: fixed; inset: 0; pointer-events:none; z-index: 50;
      box-shadow: inset 0 0 0 6px rgba(220, 38, 38, .85),
                  inset 0 0 60px 6px rgba(220, 38, 38, .35);
      animation: edge-pulse 1s ease-in-out infinite;
    }
    @keyframes edge-pulse {
      0%, 100% { opacity: .55; }
      50%      { opacity: 1; }
    }
    /* 최후 5초 강화 */
    body.countdown-critical::before {
      box-shadow: inset 0 0 0 10px rgba(220, 38, 38, 1),
                  inset 0 0 100px 10px rgba(220, 38, 38, .55);
      animation-duration: .55s;
    }
    body.countdown-critical #countdown-overlay .num {
      color: rgba(220, 38, 38, 1);
    }
  </style>
</head>

<body class="text-slate-800">

  <!-- =================== Header =================== -->

      <button id="btn-home" class="flex items-center gap-2 group">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-400 to-brand-600 grid place-items-center shadow-md">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" class="w-5 h-5">

  <main id="app" class="max-w-3xl mx-auto px-4 pt-5 pb-24"></main>

  <!-- 초읽기 오버레이 -->
  <div id="countdown-overlay" aria-hidden="true">
    <div class="num" id="countdown-num">--</div>
  </div>

  <footer class="max-w-3xl mx-auto px-4 pb-6 text-center text-xs text-slate-400">
    © VoltPass · 학습용 (실제 시험 문제와 다를 수 있습니다) · CBT 시뮬레이션
  </footer>

  <!-- =================== JavaScript =================== -->
  <script>
  /* ============================================================
   *  [1] 마스터 문제은행 (Question Pool)
   *      포맷: { id, subject, question, options[4], answer(1~4), explanation }
   *      subject : 1=전기이론, 2=전기기기, 3=전기설비
   *      과목별 25문항 → 10회차 모의고사 시드 셔플로 회차별 60문항 생성
   *      // 이후 100문항/과목까지 확장 가능한 JSON 구조
   * ============================================================ */
  const QUESTIONS = [
    /* =================== 1과목 · 전기이론 (25) =================== */
    { id:1101, subject:1, question:"옴의 법칙으로 전류 I를 옳게 나타낸 것은?",
      options:["I = V × R","I = V / R","I = R / V","I = V + R"], answer:2,
      explanation:"V = IR → I = V/R. 동일 전압에서 저항이 클수록 전류는 작아진다." },
    { id:1102, subject:1, question:"10[A]의 전류가 5초 동안 흐를 때 이동한 전기량[C]은?",
      options:["2","15","50","100"], answer:3,
      explanation:"Q = I × t = 10 × 5 = 50[C]." },
    { id:1103, subject:1, question:"R₁=4[Ω], R₂=6[Ω]을 직렬연결할 때 합성저항[Ω]은?",
      options:["2.4","5","10","24"], answer:3,
      explanation:"직렬 합성저항 R = R₁+R₂ = 4+6 = 10[Ω]." },
    { id:1104, subject:1, question:"R₁=6[Ω], R₂=3[Ω]을 병렬연결할 때 합성저항[Ω]은?",
      options:["1","2","4.5","9"], answer:2,
      explanation:"병렬: R = (R₁·R₂)/(R₁+R₂) = 18/9 = 2[Ω]." },
    { id:1105, subject:1, question:"콘덴서에 축적되는 정전에너지 W는?",
      options:["CV","½CV²","CV²","C/V"], answer:2,
      explanation:"W = ½CV² [J]. 전압의 제곱에 비례한다." },
    { id:1106, subject:1, question:"3[μF]와 6[μF]의 콘덴서를 직렬연결할 때 합성용량[μF]은?",
      options:["1","2","4.5","9"], answer:2,
      explanation:"직렬: 1/C = 1/3 + 1/6 = 1/2 → C = 2[μF]." },
    { id:1107, subject:1, question:"3[μF]와 6[μF]의 콘덴서를 병렬연결할 때 합성용량[μF]은?",
      options:["2","4.5","9","18"], answer:3,
      explanation:"병렬: C = C₁+C₂ = 3+6 = 9[μF]." },
    { id:1108, subject:1, question:"RLC 직렬회로의 공진 조건과 그때의 임피던스는?",
      options:["XL>XC, Z=R+XL","XL=XC, Z=R","XL<XC, Z=R-XC","XL=XC, Z=0"], answer:2,
      explanation:"공진 시 XL = XC가 되어 리액턴스가 상쇄, 임피던스는 R만 남는다 → 전류 최대." },
    { id:1109, subject:1, question:"키르히호프의 전류법칙(KCL)의 내용은?",
      options:["폐회로 전압의 합은 0","임의 절점에 유입·유출되는 전류의 합은 0",
              "전압강하는 전류와 저항의 곱","에너지보존법칙"], answer:2,
      explanation:"KCL: 어떤 절점에 들어가는 전류의 합과 나가는 전류의 합이 같다." },
    { id:1110, subject:1, question:"100[V], 5[A]의 부하에서 소비되는 전력[W]은?",
      options:["20","100","500","2500"], answer:3,
      explanation:"P = VI = 100 × 5 = 500[W]." },
    { id:1111, subject:1, question:"줄의 법칙에서 발생열량 H[J]를 나타내는 식은?",
      options:["H = VIt","H = I²Rt","H = V²t","H = IRt"], answer:2,
      explanation:"H = I²Rt [J]. 전류제곱과 저항, 시간의 곱." },
    { id:1112, subject:1, question:"자속밀도 B의 SI 단위는?",
      options:["[Wb]","[T] (Tesla)","[A/m]","[H]"], answer:2,
      explanation:"B = Φ/A [Wb/m² = T]. 테슬라가 SI 단위." },
    { id:1113, subject:1, question:"패러데이의 전자유도법칙의 식은?",
      options:["e = -N·dΦ/dt","e = N·Φ","e = R·I","e = L·I"], answer:1,
      explanation:"e = -N·dΦ/dt. 코일을 지나는 자속의 시간변화율에 비례." },
    { id:1114, subject:1, question:"렌츠의 법칙이 의미하는 것은?",
      options:["유도전류는 자속변화를 돕는 방향","유도전류는 자속변화를 방해하는 방향",
              "전류는 항상 전압과 동상","자속은 시간에 비례"], answer:2,
      explanation:"렌츠: 유도전류는 그 원인이 되는 자속의 변화를 방해하는 방향으로 흐른다." },
    { id:1115, subject:1, question:"정현파 교류의 실효값 V는 최대값 Vm과 어떤 관계인가?",
      options:["V = Vm","V = Vm/√2","V = √2·Vm","V = 2Vm/π"], answer:2,
      explanation:"실효값 V = Vm/√2 ≒ 0.707Vm." },
    { id:1116, subject:1, question:"정현파의 평균값(반파)은 최대값 Vm의 몇 배인가?",
      options:["1/√2","2/π","π/2","√2"], answer:2,
      explanation:"평균값 Vavg = 2Vm/π ≒ 0.637Vm (반파 기준)." },
    { id:1117, subject:1, question:"RL 직렬회로에서 임피던스 Z의 크기는?",
      options:["R+L","√(R²+XL²)","R-XL","R²+XL²"], answer:2,
      explanation:"Z = √(R²+XL²). 직각삼각형 관계." },
    { id:1118, subject:1, question:"역률 cosθ에 대한 설명으로 옳은 것은?",
      options:["피상전력/유효전력","유효전력/피상전력","무효전력/유효전력","피상전력/무효전력"], answer:2,
      explanation:"역률 = 유효전력(P) / 피상전력(S) = cosθ." },
    { id:1119, subject:1, question:"3상 Y결선에서 선간전압 VL과 상전압 Vp의 관계는?",
      options:["VL = Vp","VL = √3·Vp","VL = 3Vp","VL = Vp/√3"], answer:2,
      explanation:"Y결선: 선간전압 = √3 × 상전압, 선전류 = 상전류." },
    { id:1120, subject:1, question:"3상 Δ결선에서 선전류 IL과 상전류 Ip의 관계는?",
      options:["IL = Ip","IL = √3·Ip","IL = Ip/√3","IL = 3Ip"], answer:2,
      explanation:"Δ결선: 선전류 = √3 × 상전류, 선간전압 = 상전압." },
    { id:1121, subject:1, question:"도체의 저항 R = ρℓ/A 에서 A는 무엇인가?",
      options:["길이","고유저항","단면적","온도"], answer:3,
      explanation:"ρ:고유저항, ℓ:길이, A:단면적. 길이에 비례, 단면적에 반비례." },
    { id:1122, subject:1, question:"인덕턴스 L의 SI 단위는?",
      options:["[F] 패럿","[H] 헨리","[Ω] 옴","[Wb] 웨버"], answer:2,
      explanation:"인덕턴스 단위는 헨리[H]. 1H = 1V·s/A." },
    { id:1123, subject:1, question:"두 도체에 같은 방향의 전류가 흐를 때 작용하는 힘은?",
      options:["서로 잡아당기는 힘","서로 반발하는 힘","힘이 작용하지 않음","주기적으로 바뀜"], answer:1,
      explanation:"같은 방향 전류 → 흡인력, 반대 방향 → 반발력 (앙페르의 힘)." },
    { id:1124, subject:1, question:"전기력선의 성질로 옳지 않은 것은?",
      options:["+에서 -로 향한다","서로 교차한다","도체 표면에 수직","자체적으로 폐곡선이 아니다"], answer:2,
      explanation:"전기력선은 절대 서로 교차하지 않는다." },
    { id:1125, subject:1, question:"단상 교류 전력 P[W]를 구하는 식은?",
      options:["P = VI","P = VI·cosθ","P = √3·VI·cosθ","P = VI·sinθ"], answer:2,
      explanation:"단상: P = VI·cosθ. 3상: P = √3·VL·IL·cosθ." },

    /* =================== 2과목 · 전기기기 (25) =================== */
    { id:2101, subject:2, question:"직류 발전기의 유기기전력 E에 대한 설명으로 옳은 것은?",
      options:["자속에 반비례","회전수에 반비례","자속·회전수에 비례","권수에 반비례"], answer:3,
      explanation:"E = (pZ/60a)·φ·N → 자속 φ와 회전수 N에 비례." },
    { id:2102, subject:2, question:"변압기 권수비 a = N₁/N₂ = 10, 1차전압이 2200[V]이면 2차전압[V]은?",
      options:["22","220","2200","22000"], answer:2,
      explanation:"V₂ = V₁/a = 2200/10 = 220[V]." },
    { id:2103, subject:2, question:"3상 유도전동기의 회전방향을 바꾸는 가장 일반적인 방법은?",
      options:["전압을 낮춘다","주파수를 변경","임의의 2선을 바꾼다","중성선을 끊는다"], answer:3,
      explanation:"3상 중 임의의 두 상의 결선을 바꾸면 상순이 바뀌어 역회전한다." },
    { id:2104, subject:2, question:"동기속도 Ns = 1800[rpm], 회전자속도 N = 1764[rpm]일 때 슬립[%]은?",
      options:["1","2","5","10"], answer:2,
      explanation:"s = (Ns-N)/Ns × 100 = (1800-1764)/1800 × 100 = 2[%]." },
    { id:2105, subject:2, question:"변압기 절연유의 구비조건으로 옳지 않은 것은?",
      options:["절연내력이 클 것","인화점이 낮을 것","냉각효과가 클 것","화학적으로 안정"], answer:2,
      explanation:"절연유는 인화점이 '높아야' 화재 위험이 적다." },
    { id:2106, subject:2, question:"동기속도 Ns[rpm]를 구하는 식은? (f:주파수, P:극수)",
      options:["Ns = 60f/P","Ns = 120f/P","Ns = f/P","Ns = 120P/f"], answer:2,
      explanation:"동기속도 Ns = 120f/P [rpm]." },
    { id:2107, subject:2, question:"직류 분권전동기의 속도 제어방법이 아닌 것은?",
      options:["계자제어","저항제어","전압제어","주파수제어"], answer:4,
      explanation:"주파수제어는 교류기(인버터)에 해당. 직류기는 계자/저항/전압제어." },
    { id:2108, subject:2, question:"변압기의 무부하 시험으로 알 수 있는 손실은?",

  /* ============================================================
   *  [4] 시드 셔플 + 회차별 시험지 생성
   * ============================================================ */
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function seededShuffle(arr, seed){
    const rng = mulberry32(seed);
    const a = arr.slice();
    for (let i=a.length-1; i>0; i--){
      const j = Math.floor(rng()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  // 마스터 캐시
  const POOLS = {
    1: QUESTIONS.filter(q=>q.subject===1),
    2: QUESTIONS.filter(q=>q.subject===2),
    3: QUESTIONS.filter(q=>q.subject===3)
  };
  // 회차별 60문항 ID 배열 생성 (1과목 20 + 2과목 20 + 3과목 20, 과목별 라운드내 다시 셔플)
  function buildRound(round){
    const seedBase = round * 7919 + 13;
    const out = [];
    for (let s=1; s<=3; s++){
      let pool = seededShuffle(POOLS[s], seedBase + s);
      while (pool.length < 20) pool = pool.concat(seededShuffle(POOLS[s], seedBase + s + 100));
      out.push(...pool.slice(0,20));
    }
    // 과목 혼합 출제(실제 CBT처럼)
    return seededShuffle(out, seedBase + 999).map(q=>q.id);
  }

          </button>

  /* ============================================================
   *  [7-B] 회차 시작 전 모드 설정 모달
   * ============================================================ */
  function renderSetup(round){

      state.rounds[round] = {
        ids: buildRound(round),
        answers: {},
        flags: {},
        cursor: 0,

  /* ============================================================
   *  [8] CBT 시험 화면 (전체 + 문항당 타이머 + 초읽기)
   * ============================================================ */
  // 문항 진입 시각 (메모리만; 새로고침/이어하기 시 그 문항 진입 시점으로 리셋)
  let questionEnteredAt = 0;
  let lastVibrateSec = -1;

  function deactivateCountdown(){
    document.body.classList.remove('countdown-active','countdown-critical');
    const ov = document.getElementById('countdown-overlay');
    if (ov) ov.classList.remove('active');
    lastVibrateSec = -1;
  }

  function renderExam(round){
    const rec = state.rounds[round];
    if (!rec){ navigate({name:'setup', round}); return; }

    // 전체 시간 종료 체크
    const elapsedTotal = Math.floor((Date.now() - rec.startedAt)/1000);
    if (rec.durationSec - elapsedTotal <= 0){
      finishExam(round, true);
      return;
    }

    const isCountdown = rec.countdownThreshold != null;
    const QSEC = 60;          // 문항당 1분
    const TH   = rec.countdownThreshold || 0;

    function enterQuestion(){
      questionEnteredAt = Date.now();
      lastVibrateSec = -1;
      deactivateCountdown();
    }

    function renderInner(){
      const qid = rec.ids[rec.cursor];
      const q = QUESTIONS.find(x=>x.id===qid);
      const picked = rec.answers[qid];
      const flagged = !!rec.flags[qid];
      const answeredCount = Object.values(rec.answers).filter(v=>v!=null).length;
      const totalLeft = rec.durationSec - Math.floor((Date.now() - rec.startedAt)/1000);

      $app.innerHTML = `
        <section class="fade-in">
          <!-- 상단: 회차 / 타이머 -->
          <div class="flex items-center justify-between mb-3 gap-2">
            <button id="exam-back" class="text-sm text-slate-500 truncate">← 일시 저장 후 나가기</button>
            <div class="flex items-center gap-2">
              ${ isCountdown ? `<div id="q-timer" class="q-timer px-2.5 py-1.5 rounded-lg font-bold text-sm">⏳ 60s</div>` : `` }
              <div id="timer" class="timer-pill px-3 py-1.5 rounded-lg font-bold text-sm">⏱ ${fmtTime(totalLeft)}</div>
            </div>
          </div>

          <!-- 진행 -->
          <div class="flex items-center justify-between text-xs text-slate-500 mb-1">
            <span>
              <b class="text-brand-700">제 ${round} 회</b> · ${rec.cursor+1} / 60
              · <span class="text-slate-400">${subjectShort[q.subject]}</span>
              ${ isCountdown ? `<span class="ml-1 px-1.5 py-0.5 rounded bg-rose-100 text-rose-700 text-[10px] font-bold">🔥 ${TH}s 초읽기</span>` : '' }
            </span>
            <span>응답 ${answeredCount}/60</span>
          </div>
          <div class="w-full h-1.5 rounded-full progress-track overflow-hidden mb-4">
            <div class="h-full progress-bar" style="width:${((rec.cursor+1)/60)*100}%"></div>
          </div>

          <!-- 문항 카드 -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <div class="flex items-start justify-between gap-2">
              <h3 class="text-base sm:text-lg font-semibold text-slate-900 leading-relaxed">
                <span class="text-brand-600 font-extrabold">Q${rec.cursor+1}.</span>
                ${escapeHtml(q.question)}
              </h3>
              <button id="flag-btn" class="flex-shrink-0 text-xs px-2 py-1 rounded-lg border ${flagged?'bg-amber-500 text-white border-amber-500':'bg-white text-amber-700 border-amber-300'} font-semibold">
                ${flagged?'🚩 책갈피':'⚐ 책갈피'}
              </button>
            </div>

            <div class="space-y-2.5 mt-4">
              ${q.options.map((opt,i)=>{
                const n = i+1;
                const id = `opt-${qid}-${n}`;
                const ck = picked===n ? 'checked':'';
                return `
                  <input class="opt-input hidden" type="radio" name="opt-${qid}" id="${id}" value="${n}" ${ck}>
                  <label for="${id}" class="opt-label flex items-start gap-3 rounded-xl p-3 cursor-pointer bg-white">
                    <span class="opt-num flex-shrink-0 w-7 h-7 rounded-full border border-slate-300 text-slate-600 grid place-items-center text-sm font-bold">${n}</span>
                    <span class="text-sm sm:text-base text-slate-800 leading-relaxed pt-0.5">${escapeHtml(opt)}</span>
                  </label>`;
              }).join('')}
            </div>
          </div>

          <!-- 이전/다음 -->
          <div class="grid grid-cols-3 gap-2 mt-4">
            <button id="prev-btn" class="py-3 rounded-xl bg-slate-100 text-slate-700 font-bold disabled:opacity-40" ${rec.cursor===0?'disabled':''}>← 이전</button>
            <button id="clear-btn" class="py-3 rounded-xl bg-white border border-slate-200 text-slate-600 font-bold">답안 지우기</button>
            <button id="next-btn" class="py-3 rounded-xl bg-brand-600 text-white font-bold ${rec.cursor===59?'!bg-rose-600':''}">${rec.cursor===59?'시험 종료':'다음 →'}</button>
          </div>

          <!-- 문항 네비게이션 (CBT 답안지) -->
          <div class="mt-5 bg-white rounded-2xl border border-slate-200 p-3">
            <div class="text-[11px] text-slate-500 mb-2 px-1 flex items-center gap-3 flex-wrap">
              <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-slate-200"></span>미응시</span>
              <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-200"></span>응시</span>
              <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-amber-200"></span>책갈피</span>
              <span class="ml-auto text-slate-400">이전 문항 자유 이동 가능</span>
            </div>
            <div class="grid grid-cols-10 gap-1.5" id="nav-grid">
              ${rec.ids.map((id,idx)=>{
                const ans = rec.answers[id]!=null;
                const fg  = !!rec.flags[id];
                const cls = fg ? 'nav-flagged' : (ans ? 'nav-answered' : 'nav-blank');
                const cur = idx===rec.cursor ? 'nav-current' : '';
                return `<button class="nav-cell ${cls} ${cur}" data-jump="${idx}">${idx+1}</button>`;
              }).join('')}
            </div>
            <button id="submit-btn" class="mt-3 w-full py-3 rounded-xl bg-rose-600 text-white font-bold hover:bg-rose-700">⏹ 시험 종료 및 채점</button>
          </div>
        </section>
      `;

      // 이벤트
      $app.querySelectorAll(`input[name="opt-${qid}"]`).forEach(inp=>{
        inp.addEventListener('change', e=>{
          rec.answers[qid] = Number(e.target.value);
          saveState();
          const cell = document.querySelector(`[data-jump="${rec.cursor}"]`);
          if (cell){ cell.classList.remove('nav-blank'); cell.classList.add(rec.flags[qid]?'nav-flagged':'nav-answered'); }
        });
      });
      document.getElementById('flag-btn').onclick = ()=>{
        rec.flags[qid] = !rec.flags[qid];
        saveState(); enterQuestion(); renderInner();
      };
      document.getElementById('clear-btn').onclick = ()=>{
        delete rec.answers[qid]; saveState();
        // 답안 지우기는 시간 리셋 안 함 (제자리)
        renderInner();
      };
      document.getElementById('prev-btn').onclick = ()=>{
        if (rec.cursor>0){ rec.cursor--; saveState(); enterQuestion(); renderInner(); }
      };
      document.getElementById('next-btn').onclick = ()=>{
        if (rec.cursor < 59){ rec.cursor++; saveState(); enterQuestion(); renderInner(); }
        else { confirmSubmit(); }
      };
      document.getElementById('submit-btn').onclick = confirmSubmit;
      document.getElementById('exam-back').onclick = ()=>{
        saveState();
        if (timerHandle) clearInterval(timerHandle);
        deactivateCountdown();
        navigate({name:'home'});
      };
      $app.querySelectorAll('[data-jump]').forEach(b=>{
        b.onclick = ()=>{ rec.cursor = Number(b.dataset.jump); saveState(); enterQuestion(); renderInner(); };
      });

      attachTimer();
    }

    function confirmSubmit(){
      const unanswered = 60 - Object.values(rec.answers).filter(v=>v!=null).length;
      const msg = unanswered>0
        ? `미응시 ${unanswered}문항이 있습니다. 정말 종료할까요?`
        : `시험을 종료하고 채점할까요?`;
      if (confirm(msg)) { deactivateCountdown(); finishExam(round, false); }
    }

    function autoAdvance(){
      // 마지막 60번 문항에서는 자동 이동/제출하지 않음.
      // 시간이 남았다면 네비게이션으로 다른 문항을 재검토할 수 있도록 머무름.
      // 시험 종료는 (1) 사용자가 종료 버튼을 누르거나 (2) 전체 60분 만료 시에만.
      if (rec.cursor >= 59){
        deactivateCountdown();
        return;
      }
      rec.cursor++;
      saveState();
      enterQuestion();
      renderInner();
    }

    function attachTimer(){
      const elTimer  = document.getElementById('timer');
      const elQTimer = document.getElementById('q-timer');
      const ovNum    = document.getElementById('countdown-num');
      const overlay  = document.getElementById('countdown-overlay');

      const tick = ()=>{
        // 전체 시간
        const e = Math.floor((Date.now() - rec.startedAt)/1000);
        const left = rec.durationSec - e;
        if (left<=0){
          clearInterval(timerHandle); timerHandle=null;
          deactivateCountdown();
          alert('⏰ 시험 시간이 종료되었습니다. 자동 채점합니다.');
          finishExam(round, true);
          return;
        }
        if (elTimer){
          elTimer.textContent = `⏱ ${fmtTime(left)}`;
          if (left <= 300) elTimer.classList.add('timer-warn');
        }

        // 문항당 타이머 (초읽기 모드일 때만 강제 이동)
        const qElapsed = Math.floor((Date.now() - questionEnteredAt)/1000);
        const qLeft = Math.max(0, QSEC - qElapsed);

        if (isCountdown){
          // 1) 표시 (60번 문항에서 1분 초과 시에는 자동 이동 없음 → 표시만 정리)
          if (elQTimer){
            if (rec.cursor >= 59 && qElapsed >= QSEC){
              elQTimer.textContent = `⏳ --`;
              elQTimer.classList.remove('qt-warn');
            } else {
              elQTimer.textContent = `⏳ ${qLeft}s`;
              elQTimer.classList.toggle('qt-warn', qLeft <= TH);
            }
          }
          // 2) 카운트다운 오버레이 ON/OFF
          if (qLeft <= TH && qLeft > 0){
            document.body.classList.add('countdown-active');
            if (qLeft <= 5) document.body.classList.add('countdown-critical');
            else            document.body.classList.remove('countdown-critical');
            if (overlay) overlay.classList.add('active');
            if (ovNum)   ovNum.textContent = String(qLeft);

            // 매초 진동 (마지막 5초는 더 강하게)
            if (qLeft !== lastVibrateSec){
              lastVibrateSec = qLeft;
              try {
                if (navigator.vibrate){
                  navigator.vibrate(qLeft <= 5 ? [120,40,120] : 70);
                }
              } catch {}
            }
          } else {
            deactivateCountdown();
          }
          // 3) 60초 도달 → 강제 이동
          if (qElapsed >= QSEC){
            deactivateCountdown();
            autoAdvance();
            return;
          }
        }
      };

      if (timerHandle) clearInterval(timerHandle);
      timerHandle = setInterval(tick, 1000);
      tick(); // 즉시 1회
    }

    enterQuestion();
    renderInner();
  }

  /* ============================================================
   *  [9] 채점 및 결과
   * ============================================================ */
  function finishExam(round, auto){
    const rec = state.rounds[round];
    if (!rec || rec.finished) { navigate({name:'result', round}); return; }
    let correct = 0;
    const subjectCorrect = {1:0,2:0,3:0};
    const subjectTotal   = {1:0,2:0,3:0};
    rec.ids.forEach(id=>{
      const q = QUESTIONS.find(x=>x.id===id);
      subjectTotal[q.subject]++;
      const picked = rec.answers[id];
      if (picked === q.answer){
        correct++; subjectCorrect[q.subject]++;
      } else if (picked != null){
        toggleWrong(id, true); // 오답 자동 등록
      }
    });
    rec.score = Math.round(correct/60*100);
    rec.passed = rec.score >= 60;
    rec.correct = correct;
    rec.subjectCorrect = subjectCorrect;
    rec.subjectTotal = subjectTotal;
    rec.finished = true;
    rec.finishedAt = Date.now();
    rec.autoSubmitted = !!auto;
    saveState();
    if (timerHandle){ clearInterval(timerHandle); timerHandle=null; }
    deactivateCountdown();
    navigate({name:'result', round});
  }

  function renderResult(round){
    const rec = state.rounds[round];
    if (!rec || !rec.finished){ navigate({name:'exam', round}); return; }

    $app.innerHTML = `
      <section class="fade-in">

        <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm text-center">

        <!-- 액션 -->

    document.getElementById('back-home-r').onclick = ()=>navigate({name:'home'});

      delete state.rounds[round];
      saveState();
      navigate({name:'exam', round});
    };
    document.getElementById('r-review').onclick = ()=>renderReviewPanel(round, 'all');
    document.getElementById('r-wrong').onclick  = ()=>renderReviewPanel(round, 'wrong');
  }

  function renderReviewPanel(round, mode){
    const rec = state.rounds[round];
    const panel = document.getElementById('review-panel');
    const items = rec.ids.map(id=>{
      const q = QUESTIONS.find(x=>x.id===id);
      const picked = rec.answers[id];
      const ok = picked === q.answer;
      return { q, picked, ok };
    }).filter(x => mode==='all' ? true : !x.ok);

    panel.innerHTML = `
      <div class="text-sm font-bold text-slate-700 mb-2">${mode==='all'?'전체 해설':'오답만'} (${items.length}문항)</div>
      ${ items.length===0 ? `<div class="bg-white rounded-xl border border-slate-200 p-6 text-center text-slate-500">모두 정답입니다! 👏</div>` :
      items.map((it,idx)=>{
        const q = it.q;
        return `
          <details class="bg-white rounded-xl border border-slate-200 p-4 mb-2" ${mode==='wrong'?'':''}>
            <summary class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 flex-1 min-w-0">
                <span class="flex-shrink-0 text-[10px] font-bold ${it.ok?'bg-emerald-100 text-emerald-700':'bg-rose-100 text-rose-700'} px-1.5 py-0.5 rounded">${it.ok?'O':'X'}</span>
                <span class="text-[11px] text-slate-500 flex-shrink-0">${subjectShort[q.subject]}</span>
                <span class="text-sm text-slate-800 truncate">${escapeHtml(q.question)}</span>
              </div>
              <svg class="acc-arrow w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
            </summary>
            <div class="mt-3 pt-3 border-t border-slate-100 space-y-2">
              ${q.options.map((opt,i)=>{
                const n=i+1;
                let cls='border-slate-200';
                if (n===q.answer) cls='border-emerald-400 bg-emerald-50';
                else if (n===it.picked) cls='border-rose-400 bg-rose-50';
                return `<div class="flex items-start gap-2 p-2 rounded border ${cls}">
                  <span class="w-6 h-6 rounded-full bg-slate-100 text-slate-700 grid place-items-center text-xs font-bold flex-shrink-0">${n}</span>
                  <span class="text-sm">${escapeHtml(opt)}</span>
                </div>`;
              }).join('')}
              <div class="text-sm bg-sky-50 border border-sky-200 rounded p-3 mt-2">
                <b class="text-sky-700">해설.</b> ${escapeHtml(q.explanation)}
              </div>
              <button data-wq="${q.id}" class="text-xs text-amber-700 font-semibold hover:underline">
                ${state.wrongIds.includes(q.id)?'★ 오답노트에서 제거':'☆ 오답노트에 추가'}
              </button>
            </div>
          </details>`;
      }).join('')}
    `;
    panel.querySelectorAll('[data-wq]').forEach(b=>{
      b.onclick = ()=>{ toggleWrong(Number(b.dataset.wq)); renderReviewPanel(round, mode); updateWrongBadge(); };
    });
  }

  /* ============================================================
   *  [10] 핵심 정리 (Notes)
   * ============================================================ */
  function renderNotesList(){
    $app.innerHTML = `
      <section class="fade-in">
        <button id="n-back" class="text-sm text-brand-600 mb-3">← 대시보드</button>
        <h2 class="text-xl font-bold mb-1">📚 과목별 핵심 정리</h2>
        <p class="text-sm text-slate-500 mb-5">시험 직전 빠르게 훑어보는 압축 노트. 빈출 공식과 암기 포인트 위주로 구성.</p>

        <div class="space-y-3">
          ${Object.entries(STUDY_NOTES).map(([key, n])=>`
            <button data-note="${key}" class="hover-card w-full text-left rounded-2xl p-5 text-white shadow bg-gradient-to-br ${n.color}">
              <div class="flex items-center justify-between">
                <div>
                  <div class="text-[11px] opacity-80">${key<='3'?'필기':'실기 참고'}</div>
                  <div class="text-lg font-bold mt-0.5">${n.title}</div>
                  <div class="text-xs opacity-85 mt-1">${n.topics.length}개 핵심 토픽</div>
                </div>
                <div class="text-2xl">→</div>
              </div>
            </button>`).join('')}
        </div>
      </section>
    `;
    document.getElementById('n-back').onclick = ()=>navigate({name:'home'});
    $app.querySelectorAll('[data-note]').forEach(b=>{
      b.onclick = ()=>navigate({name:'note', subject:b.dataset.note});
    });
  }

  function renderNoteDetail(key){
    const n = STUDY_NOTES[key];
    if (!n){ navigate({name:'notes'}); return; }
    $app.innerHTML = `
      <section class="fade-in">
        <button id="nd-back" class="text-sm text-brand-600 mb-3">← 핵심정리 목록</button>
        <div class="rounded-2xl p-5 text-white bg-gradient-to-br ${n.color} mb-4 shadow">
          <div class="text-[11px] opacity-80">학습노트</div>
          <h2 class="text-xl font-bold">${n.title}</h2>
        </div>

        <div class="space-y-2">
          ${n.topics.map((t,i)=>`
            <details class="bg-white rounded-xl border border-slate-200 p-4" ${i===0?'open':''}>
              <summary class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="w-6 h-6 rounded bg-brand-100 text-brand-700 grid place-items-center text-xs font-bold">${i+1}</span>
                  <span class="font-bold text-slate-800">${t.h}</span>
                </div>
                <svg class="acc-arrow w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
              </summary>
              <div class="mt-3 pt-3 border-t border-slate-100 text-sm text-slate-700 leading-relaxed space-y-2">
                ${t.body}
              </div>
            </details>`).join('')}
        </div>
      </section>
    `;
    document.getElementById('nd-back').onclick = ()=>navigate({name:'notes'});
  }

  /* ============================================================
   *  [11] 오답 노트
   * ============================================================ */
  function renderWrongNote(){
    const items = state.wrongIds.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);
    $app.innerHTML = `
      <section class="fade-in">
        <button id="w-back" class="text-sm text-brand-600 mb-3">← 대시보드</button>
        <h2 class="text-xl font-bold mb-1">⭐ 오답 노트</h2>
        <p class="text-sm text-slate-500 mb-4">등록된 ${items.length}개 문제를 복습하세요.</p>

        ${items.length===0 ? `
          <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-500">
            아직 등록된 오답이 없습니다.
          </div>` : `
          <div class="space-y-2">
            ${items.map(q=>`
              <details class="bg-white rounded-xl border border-slate-200 p-4">
                <summary class="flex items-center justify-between gap-2">
                  <div class="flex-1 min-w-0">
                    <div class="text-[11px] font-bold text-brand-700">${subjectShort[q.subject]} · #${q.id}</div>
                    <div class="text-sm font-semibold text-slate-900 mt-0.5 truncate">${escapeHtml(q.question)}</div>
                  </div>
                  <button data-rm="${q.id}" class="flex-shrink-0 text-xs text-rose-600 hover:underline">제거</button>
                </summary>
                <div class="mt-3 pt-3 border-t border-slate-100 space-y-2">
                  ${q.options.map((opt,i)=>{
                    const n=i+1;
                    const cls = n===q.answer ? 'border-emerald-400 bg-emerald-50' : 'border-slate-200';
                    return `<div class="flex items-start gap-2 p-2 rounded border ${cls}">
                      <span class="w-6 h-6 rounded-full bg-slate-100 text-slate-700 grid place-items-center text-xs font-bold">${n}</span>
                      <span class="text-sm">${escapeHtml(opt)}</span>
                    </div>`;
                  }).join('')}
                  <div class="text-sm bg-sky-50 border border-sky-200 rounded p-3"><b class="text-sky-700">해설.</b> ${escapeHtml(q.explanation)}</div>
                </div>
              </details>`).join('')}
          </div>`}
      </section>
    `;
    document.getElementById('w-back').onclick = ()=>navigate({name:'home'});
    $app.querySelectorAll('[data-rm]').forEach(b=>{
      b.onclick = (e)=>{
        e.preventDefault(); e.stopPropagation();
        toggleWrong(Number(b.dataset.rm), false);
        renderWrongNote(); updateWrongBadge();
      };
    });
  }

  /* ============================================================
   *  [12] 글로벌 이벤트
   * ============================================================ */
  document.getElementById('btn-home').onclick  = ()=>navigate({name:'home'});
  document.getElementById('btn-notes').onclick = ()=>navigate({name:'notes'});
  document.getElementById('btn-wrong').onclick = ()=>navigate({name:'wrong'});
  document.getElementById('btn-reset').onclick = ()=>{
    if (!confirm('모든 응시 기록과 오답노트를 초기화할까요?')) return;
    localStorage.removeItem(STORAGE_KEY);
    state = loadState();
    deactivateCountdown();
    navigate({name:'home'});
  };

  // 페이지 떠날 때 진행 중 시험 저장
  window.addEventListener('beforeunload', ()=>{ saveState(); });

  /* ============================================================
   *  [13] 초기 렌더
   * ============================================================ */
  navigate({name:'home'});
  </script>
</body>
</html>
